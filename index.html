<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070809">
  <title>Tip Top Transportation — Driver Resources</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #070809;
      --surface: #111317;
      --surface-raised: #17191e;
      --surface-hover: #1b1e23;
      --border: #2a2d33;
      --border-strong: #3a3527;
      --text: #f7f5ef;
      --muted: #a7abb4;
      --subtle: #787e89;
      --gold: #dec47c;
      --gold-strong: #f0d68a;
      --gold-soft: rgba(222, 196, 124, 0.11);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(222, 196, 124, 0.12), transparent 34rem),
        linear-gradient(180deg, #0b0d10 0%, var(--page) 100%);
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px 30px 28px;
      background: linear-gradient(180deg, rgba(20, 22, 27, 0.98), rgba(14, 16, 19, 0.98));
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .logo {
      width: 100%;
      max-width: 390px;
      height: auto;
      display: block;
      margin: -8px auto 4px;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
    }

    h1 {
      text-align: center;
      font-size: clamp(1.55rem, 5vw, 1.8rem);
      font-weight: 720;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 9px;
      margin-bottom: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 82px;
      padding: 16px 17px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: rgba(222, 196, 124, 0.62);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
    }

    .link-card:active {
      transform: translateY(0);
    }

    .link-card:focus-visible {
      outline: 3px solid rgba(240, 214, 138, 0.28);
      outline-offset: 3px;
      border-color: var(--gold-strong);
    }

    .icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(222, 196, 124, 0.2);
      border-radius: 12px;
      background: var(--gold-soft);
      font-size: 1.35rem;
    }

    .link-text {
      min-width: 0;
      flex: 1;
    }

    .link-title {
      margin-bottom: 4px;
      font-size: 0.99rem;
      font-weight: 650;
      line-height: 1.25;
    }

    .link-desc {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .arrow {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: var(--subtle);
      transition: color 180ms ease, transform 180ms ease;
    }

    .link-card:hover .arrow {
      color: var(--gold-strong);
      transform: translateX(3px);
    }

    footer {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--subtle);
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 18px 14px;
      }

      .container {
        padding: 22px 18px 24px;
        border-radius: 20px;
      }

      .logo {
        margin-top: -4px;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      .link-card {
        gap: 13px;
        min-height: 78px;
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card,
      .arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="animated-logo.gif" alt="Tip Top Transportation" class="logo">
    <h1>Tip Top Resources</h1>
    <p class="subtitle">Quick access to important links</p>

    <div class="links">
      <a href="https://www.hcpss.org/f/news/calendars/calendar-202627.pdf" class="link-card" target="_blank" rel="noopener">
        <div class="icon" aria-hidden="true">📅</div>
        <div class="link-text">
          <div class="link-title">School Calendar</div>
          <div class="link-desc">HCPSS 2026–27 calendar</div>
        </div>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeWsRABcpzFYmudu8W2knJk4m82uzvr5ia3Igw9TjmC3hbtRw/viewform?usp=header" class="link-card" target="_blank" rel="noopener">
        <div class="icon" aria-hidden="true">🔧</div>
        <div class="link-text">
          <div class="link-title">Vehicle Repair &amp; Supplies Form</div>
          <div class="link-desc">Report a maintenance issue</div>
        </div>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdJT9jj7H5mU8AK8NMgLnpnT-jIXSxjOStLzRsXbYS_Glu4sw/viewform" class="link-card" target="_blank" rel="noopener">
        <div class="icon" aria-hidden="true">📋</div>
        <div class="link-text">
          <div class="link-title">Student Behavior Form</div>
          <div class="link-desc">Submit a behavior report</div>
        </div>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>

    <footer>
      Tip Top Transportation
    </footer>
  </main>
</body>
</html>
